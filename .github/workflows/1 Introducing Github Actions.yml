name: 1 Introducing Github Actions.yml( (Solar System Workflow ))
on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Tests on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: echo  Hurray Installed the node js on ${{ matrix.os }}
 

      
#A workflow runs in response to specified events. It consists of one or more jobs, each containing ordered steps that execute on a runner.
